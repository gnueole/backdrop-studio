     Description : Renders dynamic, slow-pulsing background overlays for video calls.
     ============================================================================== -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MMZMFJDN');</script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Backdrop & Virtual Overlay</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-48x48.png" type="image/png" sizes="48x48">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Outfit:wght@200;300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Load Core Stylesheet -->
    <link rel="stylesheet" href="./style.css">
    
    <!-- html2canvas for PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="./renderer.css">
</head>
<body class="mode-business theme-dark">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MMZMFJDN"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Canvas Animation Background -->
    <canvas id="backdrop-canvas"></canvas>
    
    <!-- Noise Overlay -->
    <div class="noise-overlay"></div>
    
    <!-- Name / Title Container -->
    <div class="backdrop-text-container" id="backdrop-text-container">
        <div id="backdrop-logo-container" style="display: none; line-height: 0;">
            <img id="backdrop-logo" src="" alt="Logo" style="max-height: 100%; width: auto; object-fit: contain;">
        </div>
        <div id="backdrop-text-group" style="display: flex; flex-direction: column; gap: 0.35rem;">
            <h1 id="backdrop-name"></h1>
            <div class="backdrop-subtitle-wrapper" id="backdrop-subtitle-wrapper" style="display: flex; align-items: center; gap: 0.4em; flex-wrap: wrap;">
                <p id="backdrop-title" style="margin: 0;"></p>
                <span id="backdrop-company-sep" style="opacity: 0.4; display: none;">|</span>
                <span id="backdrop-company" style="font-family: var(--font-sans); font-weight: 400; opacity: 0.6; display: none; font-size: 0.85em;"></span>
            </div>
        </div>
    </div>
    
    <!-- Bottom Border Accent -->
    <div class="backdrop-border"></div>

    <script type="module" src="./renderer.js"></script>
</body>
</html>
